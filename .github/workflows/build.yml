name: Build AutoCAD Plugin

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet Packages
      run: nuget restore AsmfMouzaVectorizer.csproj

    - name: Build Release DLL
      run: msbuild AsmfMouzaVectorizer.csproj /p:Configuration=Release /p:Platform=x64 /p:OutputPath=./bin/Publish/

    - name: Upload Compiled Plugin
      uses: actions/upload-artifact@v4
      with:
        name: AsmfMouzaVectorizer-Release
        path: ./bin/Publish/
